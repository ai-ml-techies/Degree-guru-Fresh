<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <rect width="320" height="120" rx="16" fill="#ffffff"/>
  <!-- QAA Emblem -->
  <g transform="translate(20, 20)">
    <rect x="6" y="6" width="68" height="68" rx="14" fill="#003366"/>
    <!-- Stylized Q & Checkmark/Ribbon -->
    <circle cx="36" cy="36" r="18" stroke="#ffffff" stroke-width="4.5" fill="none"/>
    <path d="M46 46 L60 60" stroke="#00A3E0" stroke-width="5" stroke-linecap="round"/>
    <path d="M28 36 L34 42 L46 28" stroke="#00A3E0" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Typography -->
  <text x="108" y="44" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#003366" letter-spacing="1">QAA</text>
  <text x="108" y="66" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#1e293b" letter-spacing="0.3">UK QUALITY ASSURED</text>
  <text x="108" y="82" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="9.5" fill="#64748b">Quality Assurance Agency</text>
  <text x="108" y="96" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="9" fill="#0284c7">for Higher Education, UK</text>
