name: Deploy Backend & API (Hostinger)
# Triggering deployment with verified Hostinger FTP credentials

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Subdomain(s) to deploy backend to'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api
          - admin

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP with Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, gd, zip
          tools: composer:v2

      - name: Install Composer Dependencies
        working-directory: ./backend
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction --no-scripts --ignore-platform-reqs || composer update --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction --no-scripts --ignore-platform-reqs

      - name: Prepare Clean Backend Bundle
        run: |
          mkdir -p backend-deploy

          # Copy core application directories and files
          cp -r backend/assets backend-deploy/
          cp -r backend/commands backend-deploy/
          cp -r backend/config backend-deploy/
          cp -r backend/controllers backend-deploy/
          cp -r backend/mail backend-deploy/
          cp -r backend/models backend-deploy/
          cp -r backend/views backend-deploy/
          cp -r backend/web backend-deploy/
          cp -r backend/vendor backend-deploy/
          cp backend/yii backend-deploy/
          cp backend/.htaccess backend-deploy/

          # Clean dev/temporary files if present
          rm -rf backend-deploy/web/assets/*
          rm -f backend-deploy/config/db-local.php
          rm -f backend-deploy/config/params-local.php

          # Ensure runtime structure exists without copying runtime files
          mkdir -p backend-deploy/runtime/cache backend-deploy/runtime/logs
          touch backend-deploy/runtime/.gitkeep

          # Ensure upload directories structure exists
          mkdir -p backend-deploy/web/uploads/images
          mkdir -p backend-deploy/web/uploads/resumes
          mkdir -p backend-deploy/web/uploads/seeker-resumes
          mkdir -p backend-deploy/web/uploads/job-docs
          touch backend-deploy/web/uploads/images/.gitkeep
          touch backend-deploy/web/uploads/resumes/.gitkeep
          touch backend-deploy/web/uploads/seeker-resumes/.gitkeep
          touch backend-deploy/web/uploads/job-docs/.gitkeep

      - name: Diagnose Hostinger FTP Connection & Directories
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_API_USERNAME: ${{ secrets.FTP_API_USERNAME }}
          FTP_ADMIN_USERNAME: ${{ secrets.FTP_ADMIN_USERNAME }}
        run: |
          python3 - << 'EOF'
          import os
          from ftplib import FTP, error_perm

          server = os.environ.get("FTP_SERVER", "")
          password = os.environ.get("FTP_PASSWORD", "")
          users = [
              ("FTP_API_USERNAME", os.environ.get("FTP_API_USERNAME", "")),
              ("FTP_ADMIN_USERNAME", os.environ.get("FTP_ADMIN_USERNAME", "")),
              ("FTP_USERNAME", os.environ.get("FTP_USERNAME", ""))
          ]

          print(f"Connecting to {server}:21...")
          for label, user in users:
              if not user:
                  print(f"[{label}] is empty, skipping.")
                  continue
              print(f"\n--- Testing [{label}] = '{user}' ---")
              try:
                  ftp = FTP()
                  ftp.connect(server, 21, timeout=15)
                  ftp.login(user, password)
                  print(f"SUCCESS: Connected and logged in as {user}!")
                  print(f"Current Working Directory (PWD): {ftp.pwd()}")
                  print("Directory Contents:")
                  ftp.retrlines("LIST")
                  ftp.quit()
              except error_perm as e:
                  print(f"LOGIN FAILED for {user}: {e}")
              except Exception as e:
                  print(f"ERROR: {e}")
          EOF

      - name: Deploy to api.degreeguru.in via FTP
        if: ${{ github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'api' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend-deploy/
          server-dir: ${{ secrets.FTP_API_DIR || 'public_html/api/' }}
          timeout: 600000
          dangerous-clean-slate: false
          exclude: |
            **/runtime/**
            **/web/uploads/**
            **/config/db-local.php
            **/config/params-local.php

      - name: Deploy to admin.degreeguru.in via FTP
        if: ${{ github.event.inputs.target == null || github.event.inputs.target == 'all' || github.event.inputs.target == 'admin' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./backend-deploy/
          server-dir: ${{ secrets.FTP_ADMIN_DIR || 'public_html/admin/' }}
          timeout: 600000
          dangerous-clean-slate: false
          exclude: |
            **/runtime/**
            **/web/uploads/**
            **/config/db-local.php
            **/config/params-local.php
