services:
  # ── MySQL Database ────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: degree_guru_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-degree_guru}
      MYSQL_USER: ${DB_USER:-degree_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-degree_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/sql/full_schema.sql:/docker-entrypoint-initdb.d/01_full_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - degree_guru_net

  # ── Yii2 PHP 8.2 Backend ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: degree_guru_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DEGREE_GURU_ENV: ${APP_ENV:-dev}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-degree_guru}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8091,http://frontend:8080
    volumes:
      - ./backend:/var/www/html
      - backend_runtime:/var/www/html/runtime
      - backend_assets:/var/www/html/web/assets
    ports:
      - "${BACKEND_PORT:-8091}:80"
    networks:
      - degree_guru_net

  # ── React + Vite Frontend (Dev Mode) ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: degree_guru_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:80
      NODE_ENV: development
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - degree_guru_net

  # ── phpMyAdmin (Database Management Web GUI) ──────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: degree_guru_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-secret}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8085}:80"
    networks:
      - degree_guru_net

volumes:
  db_data:
    driver: local
  backend_runtime:
    driver: local
  backend_assets:
    driver: local

networks:
  degree_guru_net:
    driver: bridge
