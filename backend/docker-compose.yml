# Degree Guru Backend - Standalone Docker Compose
# Note: To run the full application (Frontend + Backend + MySQL),
# run `docker compose up` from the project root instead.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: degree_guru_backend_standalone
    environment:
      DEGREE_GURU_ENV: dev
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_NAME: degree_guru
      DB_USER: root
      DB_PASSWORD: ""
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8091
    ports:
      - "8091:80"
    volumes:
      - ./:/var/www/html
